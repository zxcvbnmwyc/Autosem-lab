server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Flask enforces a 25 MiB file limit. Leave enough room for multipart
    # request framing so Nginx does not reject an otherwise valid upload first.
    client_max_body_size 27m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static assets use a content-derived query string in templates, so they
    # can be cached aggressively without risking stale frontend code.
    location ^~ /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CPU SAM2 inference can take longer than a conventional web request.
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
